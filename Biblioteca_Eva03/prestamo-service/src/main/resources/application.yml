spring:
  application:
    name: prestamo-service
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
server:
  port: ${SERVER_PORT:8083}
services:
  libro:
    url: ${LIBRO_SERVICE_URL:http://localhost:8081}
  lector:
    url: ${LECTOR_SERVICE_URL:http://localhost:8082}
